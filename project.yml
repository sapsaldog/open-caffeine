name: OpenCaffeine
options:
  bundleIdPrefix: com.opencaffeine
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_NAME: "Open Caffeine"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  OpenCaffeine:
    type: application
    platform: macOS
    sources:
      - path: OpenCaffeine
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: OpenCaffeine
    info:
      path: OpenCaffeine/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: "Open Caffeine"
        CFBundleDisplayName: "Open Caffeine"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: ""
        SUFeedURL: "https://raw.githubusercontent.com/sapsaldog/open-caffeine/main/appcast.xml"
        SUPublicEDKey: "diEC25Ttj2TyM4Q2jRGKiGJrNnMOlhKrfkfVbIIxjSc="
        SUEnableAutomaticChecks: true
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed (brew install swiftlint)"
          fi
        basedOnDependencyAnalysis: false

  OpenCaffeineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenCaffeineTests
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Open Caffeine.app/Contents/MacOS/Open Caffeine"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: OpenCaffeineTests
    dependencies:
      - target: OpenCaffeine

schemes:
  OpenCaffeine:
    build:
      targets:
        OpenCaffeine: all
        OpenCaffeineTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - OpenCaffeine
      targets:
        - OpenCaffeineTests
    run:
      config: Debug
    archive:
      config: Release
