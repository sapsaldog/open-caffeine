name: OpenCaffeine
options:
  bundleIdPrefix: com.opencaffeine
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "4"
    PRODUCT_NAME: "Open Caffeine"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  OpenCaffeine:
    type: application
    platform: macOS
    sources:
      - path: OpenCaffeine
      - path: Shared
      # launchd job for the lid-mode helper, registered via SMAppService.daemon.
      - path: OpenCaffeineHelper/com.opencaffeine.OpenCaffeine.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: OpenCaffeine
    info:
      path: OpenCaffeine/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: "Open Caffeine"
        CFBundleDisplayName: "Open Caffeine"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: ""
        SUFeedURL: "https://raw.githubusercontent.com/sapsaldog/open-caffeine/main/appcast.xml"
        SUPublicEDKey: "diEC25Ttj2TyM4Q2jRGKiGJrNnMOlhKrfkfVbIIxjSc="
        SUEnableAutomaticChecks: true
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - target: OpenCaffeineHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed (brew install swiftlint)"
          fi
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # Xcode gives team-signed command-line tools a com.apple.application-identifier
      # entitlement. Without a provisioning profile macOS may refuse to launch the
      # helper (it runs as root under launchd), and it needs no entitlements at all.
      # Re-sign the embedded copy without entitlements but keep its identifier and
      # signing flags (hardened runtime); the app's own signature, made after this
      # phase, then seals that version.
      - name: Strip helper entitlements
        script: |
          helper="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/OpenCaffeineHelper"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" \
            --preserve-metadata=identifier,flags,runtime "$helper"
        basedOnDependencyAnalysis: false

  # Root helper behind "Stay awake with lid closed": runs `pmset -a disablesleep`.
  OpenCaffeineHelper:
    type: tool
    platform: macOS
    sources:
      - path: OpenCaffeineHelper
        excludes:
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: OpenCaffeineHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.opencaffeine.OpenCaffeine.helper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES

  OpenCaffeineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenCaffeineTests
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Open Caffeine.app/Contents/MacOS/Open Caffeine"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: OpenCaffeineTests
    dependencies:
      - target: OpenCaffeine

schemes:
  OpenCaffeine:
    build:
      targets:
        OpenCaffeine: all
        OpenCaffeineTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - OpenCaffeine
      targets:
        - OpenCaffeineTests
    run:
      config: Debug
    archive:
      config: Release
