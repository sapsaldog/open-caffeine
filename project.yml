name: OpenCaffein
options:
  bundleIdPrefix: com.opencaffein
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: "Open Caffein"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  OpenCaffein:
    type: application
    platform: macOS
    sources:
      - path: OpenCaffein
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: OpenCaffein
    info:
      path: OpenCaffein/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: "Open Caffein"
        CFBundleDisplayName: "Open Caffein"
        NSHumanReadableCopyright: ""
    dependencies:
      - package: KeyboardShortcuts
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed (brew install swiftlint)"
          fi
        basedOnDependencyAnalysis: false

  OpenCaffeinTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenCaffeinTests
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Open Caffein.app/Contents/MacOS/Open Caffein"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: OpenCaffeinTests
    dependencies:
      - target: OpenCaffein

schemes:
  OpenCaffein:
    build:
      targets:
        OpenCaffein: all
        OpenCaffeinTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - OpenCaffein
      targets:
        - OpenCaffeinTests
    run:
      config: Debug
    archive:
      config: Release
